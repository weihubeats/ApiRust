name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos-arm
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/fox-tauri -> frontend/src-tauri/target"
          key: shell

      - name: Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 规避 Azure Ubuntu 镜像不可达（CI 偶发 apt-get update 卡死）
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources

      - name: Install Linux dependencies (WebKit/GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Build Tauri bundle
        shell: bash
        run: scripts/package-tauri.sh
        env:
          # updater 产物签名密钥（tauri signer generate 生成，见 docs/UPDATER.md）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename macOS updater artifacts (arch suffix)
        if: startsWith(matrix.name, 'macos')
        shell: bash
        run: |
          # arm/intel 两个构建的更新产物同名（RustFox.app.tar.gz），必须加架构后缀防覆盖
          ARCH="${{ matrix.name == 'macos-arm' && 'aarch64' || 'x64' }}"
          MAC_DIR="frontend/src-tauri/target/release/bundle/macos"
          mv "$MAC_DIR/RustFox.app.tar.gz" "$MAC_DIR/RustFox_${GITHUB_REF_NAME#v}_$ARCH.app.tar.gz"
          mv "$MAC_DIR/RustFox.app.tar.gz.sig" "$MAC_DIR/RustFox_${GITHUB_REF_NAME#v}_$ARCH.app.tar.gz.sig"

      - name: Upload artifacts (job)
        uses: actions/upload-artifact@v4
        with:
          name: rustfox-${{ matrix.name }}
          # 只上传分发产物本身；整目录上传会把 .app/AppDir 内部文件平铺成垃圾资产
          path: |
            frontend/src-tauri/target/release/bundle/macos/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz
            frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/deb/*.deb.sig
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/rpm/*.rpm.sig
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/msi/*.msi.sig
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: ls -laR artifacts

      - name: Delete existing release for this tag (retry safety)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes || true

      - name: Generate latest.json (updater manifest)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          sig_of() { cat "artifacts/$1.sig" 2>/dev/null | tr -d '\n' || true; }

          # 各平台 updater 产物（download-artifact 已剥掉 bundle/ 前缀）
          MAC_ARM_PKG="$(cd artifacts && ls macos/*_aarch64.app.tar.gz 2>/dev/null | head -1 || true)"
          MAC_INTEL_PKG="$(cd artifacts && ls macos/*_x64.app.tar.gz 2>/dev/null | head -1 || true)"
          LINUX_PKG="$(cd artifacts && ls appimage/*_amd64.AppImage 2>/dev/null | head -1 || true)"
          WIN_PKG="$(cd artifacts && ls nsis/*_x64-setup.exe 2>/dev/null | head -1 || true)"
          echo "mac-arm=$MAC_ARM_PKG mac-intel=$MAC_INTEL_PKG linux=$LINUX_PKG win=$WIN_PKG"

          python3 - "$VERSION" "$BASE" "$MAC_ARM_PKG" "$MAC_INTEL_PKG" "$LINUX_PKG" "$WIN_PKG" <<'EOF'
          import json, pathlib, sys
          from datetime import datetime, timezone
          version, base, mac_arm, mac_intel, linux, win = sys.argv[1:7]

          def entry(rel):
              if not rel:
                  return None
              rel = pathlib.Path(rel).as_posix()
              name = rel.split("/")[-1]
              sig_file = pathlib.Path("artifacts") / (rel + ".sig")
              sig = sig_file.read_text().strip() if sig_file.exists() else ""
              return {"url": f"{base}/{name}", "signature": sig}

          platforms = {
              "darwin-aarch64": entry(mac_arm),
              "darwin-x86_64": entry(mac_intel),
              "linux-x86_64": entry(linux),
              "windows-x86_64": entry(win),
          }
          manifest = {
              "version": version,
              "notes": "详见 Release Notes",
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": {k: v for k, v in platforms.items() if v},
          }
          if not manifest["platforms"]:
              sys.exit("未找到任何 updater 产物（.app.tar.gz / .AppImage / -setup.exe）")
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2))
          print(pathlib.Path("latest.json").read_text())
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RustFox ${{ github.ref_name }}
          body: |
            ## RustFox 分发包（Tauri 2）

            - **Windows**: `RustFox_x.x.x_x64-setup.exe`（NSIS 安装包）或 `RustFox_x.x.x_x64_en-US.msi`
            - **macOS**: `RustFox_x.x.x_aarch64.dmg`（Apple Silicon）或 `RustFox_x.x.x_x64.dmg`（Intel）
              ——首次打开若提示「已损坏」，执行 `xattr -cr /Applications/RustFox.app` 解除隔离（未做 Apple 公证的正常现象，详见使用手册）
            - **Linux**: `rustfox_x.x.x_amd64.deb` 与 `.AppImage`

            使用手册：[docs/USER_GUIDE.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/USER_GUIDE.md)
          files: |
            artifacts/**
            latest.json
          draft: true
          generate_release_notes: true
