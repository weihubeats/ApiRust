[workspace]
resolver = "2"
members = [
    "crates/fox-core",
    "crates/fox-storage",
    "crates/fox-http",
    "crates/fox-openapi",
    "crates/fox-mock",
    "crates/fox-test",
    "crates/fox-backup",
    "crates/fox-secret",
    "crates/fox-codegen",
    "crates/fox-oauth",
    "crates/fox-smoke",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.79"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
regex = "1"
url = "2"
mime = "0.3"
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
aes-gcm = "0.10"
base64 = "0.22"

sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "cookies",
    "multipart",
    "rustls-tls",
] }

webbrowser = "1"

axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

openapiv3 = "2.0"
jsonpath-rust = "0.5"
fake = "2.9"
rand = "0.8"
rfd = "0.14"