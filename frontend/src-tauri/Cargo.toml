[package]
name = "rustfox"
version = "0.0.6"
edition = "2021"
description = "RustFox Tauri 2 应用壳：装配 fox-tauri 插件与窗口生命周期"

# 独立工作区：不加入仓库根 workspace，避免 tauri/wry 依赖拖慢主仓构建。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fox-tauri = { path = "../../crates/fox-tauri" }

# 最终产物尺寸优先：LTO + 符号剥离（与仓库根 workspace 的 release 配置保持一致）
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
