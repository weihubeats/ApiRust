[workspace]
resolver = "2"
members = [
    "crates/fox-core",
    "crates/fox-storage",
    "crates/fox-http",
    "crates/fox-openapi",
    "crates/fox-mock",
    "crates/fox-test",
    "crates/fox-backup",
    "crates/fox-secret",
    "crates/fox-codegen",
    "crates/fox-oauth",
    "crates/fox-smoke",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.79"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 已停止维护，serde_norway 是其 API 兼容的社区接续分支
serde_norway = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 按实际用量裁剪特性（rt/macros/net/time/io-util/fs/sync），避免 full 拖慢编译
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "fs",
    "sync",
] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
regex = "1"
url = "2"
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
aes-gcm = "0.10"
base64 = "0.22"

sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "cookies",
    "multipart",
    "rustls-tls",
] }

webbrowser = "1"

axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

openapiv3 = "2.0"
jsonpath-rust = "0.5"
fake = "2.9"
rand = "0.8"

serde_urlencoded = "0.7"
rquickjs = "0.12"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "url",
    "rustls-tls-webpki-roots",
] }
shell-words = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"